#======== File I/O =====================
BitstreamFile                 : str.bin
ReconFile                     : rec.yuv

#======== Profile ================
Profile                       : auto

#======== VPS Configuration ============
# VpsId: Identifiant du Video Parameter Set
#   0 = Mode standard (pas de VPS écrit sauf si ForceVpsOutput=1)
#   1 = Active le VPS (recommandé pour multi-layer ou configurations avancées)
VpsId                         : 1

# ForceVpsOutput: Force l'écriture du VPS même si VpsId=0
#   0 = Écriture VPS uniquement si VpsId != 0
#   1 = Force l'écriture du VPS dans tous les cas
ForceVpsOutput                : 1

#======== Coding Structure =============
